[idle_timeout]
timeout: 900
gcode:
  SET_LED LED="my_neopixel" RED=0 GREEN=0 BLUE=0 SYNC=0 TRANSMIT=1
  SET_PIN PIN=lightbar VALUE=0

[gcode_macro G29]
gcode:
      BED_MESH_CLEAR
      G28
      BED_MESH_CALIBRATE
      G0 Z50 F1800
      G0 X120 Y120 F12000

[safe_z_home]
home_xy_position: 120,125
speed: 100
z_hop: 10                 
z_hop_speed: 5

[save_variables]
filename: ~/printer_data/config/save_variables.cfg

[filament_switch_sensor fila]
pause_on_runout: True
runout_gcode:
            SET_FILAMENT_SENSOR SENSOR=fila ENABLE=1
event_delay: 5.0
pause_delay: 5.0
switch_pin: PC2

[screws_tilt_adjust]
# Die Punkte müssen so angepasst werden, dass die SONDE über den Schrauben steht.
screw1: 25, 25
screw1_name: Vorne Links (Referenz)
screw2: 220, 25
screw2_name: Vorne Rechts
screw3: 220, 220
screw3_name: Hinten Rechts
screw4: 25, 220
screw4_name: Hinten Links
speed: 100
horizontal_move_z: 10
screw_thread: CW-M4 # Nutzt du M3, M4 oder M5 Schrauben? (CW = Uhrzeigersinn)

[gcode_macro VIER_PUNKT_LEVELN]
description: Startet die automatische Berechnung der 4 Bettschrauben
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28 # Homing ausführen, falls noch nicht geschehen
    {% endif %}
    SCREWS_TILT_CALCULATE # Startet die Klipper-Messung

[gcode_macro PLR_MESH_DEBUG]
gcode:
    {% if printer.bed_mesh is defined %}

        RESPOND TYPE=echo MSG="PLR DEBUG: bed_mesh vorhanden"

        RESPOND TYPE=echo MSG="profile_name={printer.bed_mesh.profile_name}"
        RESPOND TYPE=echo MSG="mesh_min={printer.bed_mesh.mesh_min}"
        RESPOND TYPE=echo MSG="mesh_max={printer.bed_mesh.mesh_max}"
        RESPOND TYPE=echo MSG="probed_matrix={printer.bed_mesh.probed_matrix}"

        RESPOND TYPE=echo MSG="bed_mesh={printer.bed_mesh}"

    {% else %}

        RESPOND TYPE=echo MSG="PLR DEBUG: printer.bed_mesh nicht vorhanden"

    {% endif %}