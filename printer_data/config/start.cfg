[gcode_macro PRINT_START]         
gcode:
    M220 S100
    M221 S100
    CLEAR_PAUSE
    M117 Printing

[gcode_macro nozzle_wipe]
gcode:
    SAVE_GCODE_STATE NAME=NOZZLE_WIPE_STATE
    G90
    G1 Z10 F3000
    G1 X230 Y257 F9000
    G1 Z0 F1200
    G1 X180 Y256 F6000
    G1 X230 Y257
    G1 X180 Y256
    G1 X230 Y257
    G1 X180 Y256
    G1 X230 Y257
    G1 X180 Y256
    G1 X230 Y257
    G1 X180 Y256
    M400
    G1 Z10 F3000
    G92 E0
    G1 E-1 F3000
    M400
    RESTORE_GCODE_STATE NAME=NOZZLE_WIPE_STATE

