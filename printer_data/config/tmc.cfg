[tmc2209 stepper_x]
uart_pin: PD9
run_current: 1.1
hold_current: 0.8
interpolate: True
stealthchop_threshold:0
driver_SGTHRS:70
diag_pin:^PD3

[tmc2209 stepper_y]
uart_pin: PD8
run_current: 1.1
hold_current: 0.8
interpolate: True
stealthchop_threshold:0
driver_SGTHRS:90
diag_pin:^PD2

[tmc2209 stepper_z]
uart_pin: PB10
run_current: 1.1
hold_current: 0.9
interpolate: True
stealthchop_threshold: 0

[tmc2209 extruder]
uart_pin: PB2
run_current: 1.0
hold_current: 0.8
interpolate: True
stealthchop_threshold: 0

[mcu rpi]
serial: /tmp/klipper_host_mcu

[force_move]
enable_force_move : true
